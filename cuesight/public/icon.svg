    <path class="bg" d="M 422.7 240 L 416.7 233.6 L 226.7 233.6 L 208 240 Z" fill="#0A4E3A"/>
    <path d="M 327.7 227.5 L 315.1 227.6 L 302.7 227.9 L 290.8 228.3 L 279.8 228.9 L 269.9 229.7 L 261.5 230.5 L 254.8 231.5 L 250.1 232.5 L 247.5 233.6 L 247.2 234.7 L 249.1 235.7 L 253.3 236.7 L 259.6 237.7 L 268 238.5 L 278.1 239.1 L 289.6 239.6 L 302.2 239.9 L 315.4 240 L 328.8 239.9 L 341.9 239.6 L 354.4 239.1 L 365.8 238.5 L 375.7 237.7 L 383.9 236.7 L 390.1 235.7 L 394.1 234.7 L 395.9 233.6 L 395.4 232.5 L 392.7 231.5 L 388 230.5 L 381.3 229.7 L 372.8 228.9 L 363 228.3 L 351.9 227.9 L 340.1 227.6 L 327.7 227.5 Z" fill="url(#holeFill)"/>
    <path d="M 395.9 180.2 L 395.9 173.5 L 395.2 167.8 L 393.8 162.4 L 391.7 157.5 L 389 152.8 L 385.7 148.5 L 381.7 144.5 L 377.3 140.9 L 372.3 137.7 L 366.8 134.9 L 361 132.5 L 354.8 130.5 L 348.3 128.9 L 341.6 127.8 L 334.7 127.1 L 327.7 126.9 L 320.6 127.1 L 313.5 127.8 L 306.5 128.9 L 299.7 130.5 L 293 132.5 L 286.5 134.9 L 280.4 137.7 L 274.7 140.9 L 269.3 144.5 L 264.5 148.5 L 260.1 152.8 L 256.3 157.5 L 253.1 162.4 L 250.6 167.8 L 248.7 173.5 L 247.5 180.2 L 247.5 233.6 L 248.7 233 L 250.6 232.4 L 253.1 231.8 L 256.3 231.2 L 260.1 230.7 L 264.5 230.2 L 269.3 229.7 L 274.7 229.3 L 280.4 228.9 L 286.5 228.5 L 293 228.2 L 299.7 228 L 306.5 227.8 L 313.5 227.7 L 320.6 227.6 L 327.7 227.5 L 334.7 227.6 L 341.6 227.7 L 348.3 227.8 L 354.8 228 L 361 228.2 L 366.8 228.5 L 372.3 228.9 L 377.3 229.3 L 381.7 229.7 L 385.7 230.2 L 389 230.7 L 391.7 231.2 L 393.8 231.8 L 395.2 232.4 L 395.9 233 L 395.9 233.6 Z" fill="url(#wallFill)"/>
    <path d="M 395.9 233.6 L 416.7 233.6 L 416.7 159.4 L 395.9 159.4 Z" fill="#17120F"/>
    <path d="M 247.5 233.6 L 226.7 233.6 L 226.7 159.4 L 247.5 159.4 Z" fill="#17120F"/>
    <path d="M 395.9 159.4 L 395.9 152.8 L 395.2 147.1 L 393.8 141.9 L 391.7 136.9 L 389 132.3 L 385.7 128.1 L 381.7 124.2 L 377.3 120.6 L 372.3 117.4 L 366.8 114.7 L 361 112.3 L 354.8 110.3 L 348.3 108.8 L 341.6 107.7 L 334.7 107 L 327.7 106.8 L 320.6 107 L 313.5 107.7 L 306.5 108.8 L 299.7 110.3 L 293 112.3 L 286.5 114.7 L 280.4 117.4 L 274.7 120.6 L 269.3 124.2 L 264.5 128.1 L 260.1 132.3 L 256.3 136.9 L 253.1 141.9 L 250.6 147.1 L 248.7 152.8 L 247.5 159.4 L 247.5 180.2 L 248.7 173.5 L 250.6 167.8 L 253.1 162.4 L 256.3 157.5 L 260.1 152.8 L 264.5 148.5 L 269.3 144.5 L 274.7 140.9 L 280.4 137.7 L 286.5 134.9 L 293 132.5 L 299.7 130.5 L 306.5 128.9 L 313.5 127.8 L 320.6 127.1 L 327.7 126.9 L 334.7 127.1 L 341.6 127.8 L 348.3 128.9 L 354.8 130.5 L 361 132.5 L 366.8 134.9 L 372.3 137.7 L 377.3 140.9 L 381.7 144.5 L 385.7 148.5 L 389 152.8 L 391.7 157.5 L 393.8 162.4 L 395.2 167.8 L 395.9 173.5 L 395.9 180.2 Z" fill="url(#brassLip)"/>
    <path class="detail" d="M 391.7 146.2 L 389 141.6 L 385.7 137.3 L 381.7 133.3 L 377.3 129.8 L 372.3 126.6 L 366.8 123.8 L 361 121.4 L 354.8 119.4 L 348.3 117.9 L 341.6 116.7 L 334.7 116.1 L 327.7 115.8 L 320.6 116.1 L 313.5 116.7 L 306.5 117.9 L 299.7 119.4 L 293 121.4 L 286.5 123.8 L 280.4 126.6 L 274.7 129.8 L 269.3 133.3 L 264.5 137.3 L 260.1 141.6 L 256.3 146.2" fill="none" stroke="#FFF6D6" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
    <path class="bg detail" d="M 247.2 233.9 L 249.1 235 L 253.3 236 L 259.6 236.9 L 268 237.7 L 278.1 238.4 L 289.6 238.8 L 302.2 239.1 L 315.4 239.2 L 328.8 239.1 L 341.9 238.8 L 354.4 238.4 L 365.8 237.7 L 375.7 236.9 L 383.9 236 L 390.1 235 L 394.1 233.9" fill="none" stroke="#49D9A6" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>

    <!-- the far cushion either side of the pocket -->
    <g class="bg">
      <path d="M 6512.7 242.1 L -5886.2 242.1 L -5818 240 L 6448.7 240 Z" fill="#03120D" opacity="0.35"/>
      <path d="M 422.7 240 L 416.7 233.6 L 416.7 169.8 L 422.7 183.3 Z" fill="#0A4E3A"/>
      <path d="M 208 240 L 226.7 233.6 L 226.7 169.8 L 208 183.3 Z" fill="#0A4E3A"/>
      <path d="M 6448.7 240 L 422.7 240 L 422.7 183.3 L 6448.7 183.3 Z" fill="url(#cushFace)"/>
      <path d="M 6448.7 183.3 L 422.7 183.3 L 416.7 169.8 L 6257.2 169.8 Z" fill="url(#cushTop)"/>
      <path class="detail" d="M 6448.7 183.3 L 422.7 183.3" fill="none" stroke="#49D9A6" stroke-opacity="0.55" stroke-width="3"/>
      <path d="M -5818 240 L 208 240 L 208 183.3 L -5818 183.3 Z" fill="url(#cushFace)"/>
      <path d="M -5818 183.3 L 208 183.3 L 226.7 169.8 L -5613.8 169.8 Z" fill="url(#cushTop)"/>
      <path class="detail" d="M -5818 183.3 L 208 183.3" fill="none" stroke="#49D9A6" stroke-opacity="0.55" stroke-width="3"/>
    </g>

    <!-- the pocket's rim on the rail: brass cap and leather -->
    <path d="M 422.6 159.4 L 422.5 152.7 L 421.5 146.9 L 419.5 141.5 L 416.5 136.5 L 412.8 131.9 L 408.1 127.5 L 402.8 123.6 L 396.6 120 L 389.9 116.8 L 382.5 114 L 374.6 111.6 L 366.2 109.6 L 357.5 108.1 L 348.4 106.9 L 339.2 106.3 L 329.7 106.1 L 320.2 106.3 L 310.7 106.9 L 301.3 108.1 L 292 109.6 L 283 111.6 L 274.3 114 L 266 116.8 L 258.2 120 L 251 123.6 L 244.3 127.5 L 238.4 131.9 L 233.2 136.5 L 228.8 141.5 L 225.2 146.9 L 222.5 152.7 L 220.8 159.4 L 247.5 159.4 L 248.7 152.8 L 250.6 147.1 L 253.1 141.9 L 256.3 136.9 L 260.1 132.3 L 264.5 128.1 L 269.3 124.2 L 274.7 120.6 L 280.4 117.4 L 286.5 114.7 L 293 112.3 L 299.7 110.3 L 306.5 108.8 L 313.5 107.7 L 320.6 107 L 327.7 106.8 L 334.7 107 L 341.6 107.7 L 348.3 108.8 L 354.8 110.3 L 361 112.3 L 366.8 114.7 L 372.3 117.4 L 377.3 120.6 L 381.7 124.2 L 385.7 128.1 L 389 132.3 L 391.7 136.9 L 393.8 141.9 L 395.2 147.1 L 395.9 152.8 L 395.9 159.4 Z" fill="#E9C46A" opacity="0.55" filter="url(#glowSm)"/>
    <path d="M 422.6 159.4 L 422.5 152.7 L 421.5 146.9 L 419.5 141.5 L 416.5 136.5 L 412.8 131.9 L 408.1 127.5 L 402.8 123.6 L 396.6 120 L 389.9 116.8 L 382.5 114 L 374.6 111.6 L 366.2 109.6 L 357.5 108.1 L 348.4 106.9 L 339.2 106.3 L 329.7 106.1 L 320.2 106.3 L 310.7 106.9 L 301.3 108.1 L 292 109.6 L 283 111.6 L 274.3 114 L 266 116.8 L 258.2 120 L 251 123.6 L 244.3 127.5 L 238.4 131.9 L 233.2 136.5 L 228.8 141.5 L 225.2 146.9 L 222.5 152.7 L 220.8 159.4 L 247.5 159.4 L 248.7 152.8 L 250.6 147.1 L 253.1 141.9 L 256.3 136.9 L 260.1 132.3 L 264.5 128.1 L 269.3 124.2 L 274.7 120.6 L 280.4 117.4 L 286.5 114.7 L 293 112.3 L 299.7 110.3 L 306.5 108.8 L 313.5 107.7 L 320.6 107 L 327.7 106.8 L 334.7 107 L 341.6 107.7 L 348.3 108.8 L 354.8 110.3 L 361 112.3 L 366.8 114.7 L 372.3 117.4 L 377.3 120.6 L 381.7 124.2 L 385.7 128.1 L 389 132.3 L 391.7 136.9 L 393.8 141.9 L 395.2 147.1 L 395.9 152.8 L 395.9 159.4 Z" fill="url(#brassCap)"/>

    <!-- ghost ball: where the cue ball meets the 1 -->
    <circle cx="640" cy="263.6" r="62.8" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="6.9"/>
    <circle class="detail" cx="640" cy="263.6" r="62.8" fill="none" stroke="#0B1220" stroke-opacity="0.35" stroke-width="6.9" stroke-dasharray="11.3 13.8"/>

    <!-- the 1-ball, cut 25° toward the pocket -->
    <ellipse cx="596" cy="312.7" rx="57.9" ry="13.1" fill="#000" opacity="0.55" filter="url(#tight)"/>
    <circle cx="592.3" cy="252.8" r="59.8" fill="url(#objBody)"/>
    <g class="detail">
      <circle cx="583.9" cy="244.4" r="25.2" fill="#FFFDF5"/>
      <path d="M 577.3 236.9 L 585.7 231.3 L 585.7 257.4" fill="none" stroke="#1B1F2A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <ellipse cx="573.6" cy="222.9" rx="14.9" ry="9.3" fill="url(#spec)" transform="rotate(-30 573.6 222.9)"/>

    <!-- the cue ball, from the player's eye: contact shadow, body, felt bounce, specular -->
    <ellipse cx="520" cy="936" rx="236" ry="40" fill="#000" opacity="0.5" filter="url(#soft)"/>
    <ellipse cx="516" cy="934" rx="150" ry="16" fill="#000" opacity="0.55" filter="url(#tight)"/>
    <circle cx="512" cy="690" r="240" fill="url(#cueBody)"/>
    <circle cx="512" cy="690" r="240" fill="url(#cueBounce)"/>
    <ellipse cx="432" cy="560" rx="78" ry="44" fill="url(#spec)" opacity="0.9" transform="rotate(-24 432 560)"/>


    <!-- where to strike it: low and right of centre (draw with outside side spin for a cut to the left) -->
    <path class="detail" d="M 394 690 L 630 690 M 512 572 L 512 808" fill="none" stroke="#0B1220" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <circle class="detail" cx="512" cy="690" r="118" fill="none" stroke="#D55E00" stroke-opacity="0.55" stroke-width="7" stroke-dasharray="14 14"/>
    <g class="detail">
      <path d="M 457.3 842.8 L 477.7 844.6 L 498.4 845.8 L 519.2 846.4 L 540 846.4 L 560.7 846 L 581 845.1 L 600.9 843.7 L 620.2 841.8 L 638.8 839.5 L 656.5 836.7 L 673.4 833.5 L 689.2 829.9 L 703.8 826 L 717.3 821.6 L 729.5 816.9 L 740.4 811.8 L 749.9 806.3 L 758 800.2 L 764.8 793.6 L 769.9 786 L 773 777.4 L 773.6 768.2 L 771.5 759.1 L 767.1 750.8 L 746.9 765.4 L 749.1 768.5 L 750.1 771 L 750.4 773.4 L 749.8 776.4 L 747.7 780.3 L 744 784.8 L 738.3 789.7 L 730.9 794.8 L 721.7 799.9 L 710.9 804.8 L 698.5 809.6 L 684.8 814 L 669.8 818.2 L 653.7 822.1 L 636.5 825.5 L 618.4 828.6 L 599.6 831.3 L 580.1 833.5 L 560.1 835.3 L 539.7 836.7 L 519.2 837.6 L 498.5 838 L 478 838.1 L 457.6 837.8 Z M 730 720.8 L 781.2 745.5 L 737.5 777.2 Z" fill="#0B1220" opacity="0.22" transform="translate(2 5)"/>
      <path d="M 457.3 842.8 L 477.7 844.6 L 498.4 845.8 L 519.2 846.4 L 540 846.4 L 560.7 846 L 581 845.1 L 600.9 843.7 L 620.2 841.8 L 638.8 839.5 L 656.5 836.7 L 673.4 833.5 L 689.2 829.9 L 703.8 826 L 717.3 821.6 L 729.5 816.9 L 740.4 811.8 L 749.9 806.3 L 758 800.2 L 764.8 793.6 L 769.9 786 L 773 777.4 L 773.6 768.2 L 771.5 759.1 L 767.1 750.8 L 746.9 765.4 L 749.1 768.5 L 750.1 771 L 750.4 773.4 L 749.8 776.4 L 747.7 780.3 L 744 784.8 L 738.3 789.7 L 730.9 794.8 L 721.7 799.9 L 710.9 804.8 L 698.5 809.6 L 684.8 814 L 669.8 818.2 L 653.7 822.1 L 636.5 825.5 L 618.4 828.6 L 599.6 831.3 L 580.1 833.5 L 560.1 835.3 L 539.7 836.7 L 519.2 837.6 L 498.5 838 L 478 838.1 L 457.6 837.8 Z M 730 720.8 L 781.2 745.5 L 737.5 777.2 Z" fill="#56B4E9" stroke="#56B4E9" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <circle cx="564" cy="724" r="60" fill="#0B1220" opacity="0.32"/>
    <circle cx="564" cy="720" r="50" fill="#56B4E9"/>
    <circle cx="564" cy="720" r="50" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <circle cx="564" cy="720" r="11" fill="#FFFFFF"/>
  </g>
</svg>
